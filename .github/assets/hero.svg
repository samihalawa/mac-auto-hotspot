  <text x="300" y="168" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f0f6fc">Auto Hotspot</text>
  <text x="302" y="218" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#8b949e">Your Mac joins your iPhone's hotspot the moment Wi-Fi drops,</text>
  <text x="302" y="252" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#8b949e">and goes back to Wi-Fi when it can. No clicks.</text>
